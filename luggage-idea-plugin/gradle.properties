pluginGroup = com.luggage.plugindev
pluginName = luggage-idea-plugin
pluginVersion = 1.0.0

pluginSinceBuild = 242

# IntelliJ IDEA Ultimate 2024.2 — the JavaScript plugin we depend on is bundled in
# IU / WebStorm / PhpStorm / PyCharm Pro / RubyMine / GoLand / Rider / RustRover.
# IntelliJ Community doesn't ship JavaScript, so this plugin isn't installable there.
platformType = IU
platformVersion = 2024.2

# JS + JSON Schema bundled modules we rely on
platformBundledPlugins = JavaScript, com.intellij.modules.json

javaVersion = 17
gradleVersion = 8.9

kotlin.code.style = official
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.parallel = true
org.gradle.caching = true
