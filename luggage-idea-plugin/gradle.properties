pluginGroup = com.luggage.plugindev
pluginName = luggage-idea-plugin
pluginVersion = 1.0.2

pluginSinceBuild = 242

# Build against IDEA Ultimate so the bundled JavaScript plugin is on the classpath.
# At install time JavaScript is an *optional* dependency (see luggage-js.xml), so the
# plugin installs cleanly on IDEA Community too — schema validation + scaffolding
# work everywhere; client.* autocomplete only lights up on IDEs with the JS plugin.
platformType = IU
platformVersion = 2024.2

# JSON support is part of the platform core in 2024.2 — only JS is a bundled plugin we pull in
platformBundledPlugins = JavaScript

javaVersion = 17
gradleVersion = 8.9

kotlin.code.style = official
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.parallel = true
org.gradle.caching = true
