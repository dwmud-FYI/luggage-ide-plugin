name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  idea:
    name: idea plugin build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: build
        working-directory: luggage-idea-plugin
        # CI only builds — verifyPlugin downloads multiple IDE distros (multi-GB)
        # and OOMs the 7GB hosted runner. The release workflow runs verifyPlugin
        # before publishPlugin so the marketplace upload is still gated on it.
        # syncSharedAssets is wired into processResources, so no manual copy here.
        run: gradle --no-daemon clean buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: idea-plugin-zip
          path: luggage-idea-plugin/build/distributions/*.zip

  vscode:
    name: vscode extension build + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: luggage-vscode-extension/package-lock.json

      - name: install
        working-directory: luggage-vscode-extension
        run: npm ci || npm install

      - name: sync shared assets
        working-directory: luggage-vscode-extension
        run: npm run sync

      - name: build
        working-directory: luggage-vscode-extension
        run: npm run build

      - name: package
        working-directory: luggage-vscode-extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: luggage-vscode-extension/*.vsix
